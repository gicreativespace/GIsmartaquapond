<svg
  class="aerator-illustration"
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 220 180"
  fill="none"
>
  <defs>
    <linearGradient id="aeratorBlade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#20B99A"/>
      <stop offset="100%" stop-color="#078D87"/>
    </linearGradient>
    <linearGradient id="aeratorHub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#36C6A5"/>
      <stop offset="100%" stop-color="#078D87"/>
    </linearGradient>
    <linearGradient id="aeratorBladeOff" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F17B75"/>
      <stop offset="100%" stop-color="#C94340"/>
    </linearGradient>
    <linearGradient id="aeratorHubOff" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F28A83"/>
      <stop offset="100%" stop-color="#C94340"/>
    </linearGradient>
  </defs>

  <!-- Motor and original support frame -->
  <rect x="97" y="35" width="26" height="24" rx="5" fill="#68868B"/>
  <path d="M40 92 L65 50 H155 L180 92" stroke="#68868B" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Water waves remain visible while OFF; movement is status controlled -->
  <g class="aerator-water">
    <path d="M15 110 Q48 98 80 110 T145 110 T205 110" stroke="#42BFAF" stroke-width="3" stroke-linecap="round"/>
    <path d="M15 126 Q48 114 80 126 T145 126 T205 126" stroke="#8BD8CC" stroke-width="3" stroke-linecap="round"/>
  </g>

  <!-- Original 8 curved blades; parent holds the wheel position, inner group spins -->
  <g class="aerator-rotor" transform="translate(110 105)">
    <g class="aerator-rotor-spin">
      <g class="aerator-blades" fill="url(#aeratorBlade)">
        <path d="M-6 -14 Q-8 -18 -6 -25 L-4 -51 Q0 -57 4 -51 L6 -25 Q8 -18 6 -14 Z"/>
        <path d="M-6 -14 Q-8 -18 -6 -25 L-4 -51 Q0 -57 4 -51 L6 -25 Q8 -18 6 -14 Z" transform="rotate(45)"/>
        <path d="M-6 -14 Q-8 -18 -6 -25 L-4 -51 Q0 -57 4 -51 L6 -25 Q8 -18 6 -14 Z" transform="rotate(90)"/>
        <path d="M-6 -14 Q-8 -18 -6 -25 L-4 -51 Q0 -57 4 -51 L6 -25 Q8 -18 6 -14 Z" transform="rotate(135)"/>
        <path d="M-6 -14 Q-8 -18 -6 -25 L-4 -51 Q0 -57 4 -51 L6 -25 Q8 -18 6 -14 Z" transform="rotate(180)"/>
        <path d="M-6 -14 Q-8 -18 -6 -25 L-4 -51 Q0 -57 4 -51 L6 -25 Q8 -18 6 -14 Z" transform="rotate(225)"/>
        <path d="M-6 -14 Q-8 -18 -6 -25 L-4 -51 Q0 -57 4 -51 L6 -25 Q8 -18 6 -14 Z" transform="rotate(270)"/>
        <path d="M-6 -14 Q-8 -18 -6 -25 L-4 -51 Q0 -57 4 -51 L6 -25 Q8 -18 6 -14 Z" transform="rotate(315)"/>
      </g>
      <circle class="aerator-hub-outer" r="14" fill="url(#aeratorHub)"/>
      <circle r="9" fill="#DDF7F0"/>
      <circle r="5" fill="#078D87"/>
    </g>
  </g>

  <!-- Water splash is animated only while starter feedback is ON -->
  <g class="aerator-splash" stroke="#35B9A5" stroke-width="2.5" stroke-linecap="round">
    <path d="M38 101 Q31 91 37 84"/>
    <path d="M182 101 Q189 91 183 84"/>
    <path d="M55 137 Q62 131 69 137"/>
    <path d="M151 137 Q158 131 165 137"/>
  </g>

  <circle class="aerator-status-indicator" cx="190" cy="32" r="5" fill="#13A887"/>
</svg>
